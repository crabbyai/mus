name: Watch property tax sources

# Reads the property transaction rates off the government pages they came from
# and checks them against what the site is showing.
#
# The finding is automatic. The publishing is not: a rate that has changed
# arrives as a pull request with a table of held-versus-found, and a person
# merges it. That is deliberate — these numbers end up in front of buyers
# working out what they can afford, and a mis-parse would be silent.
#
# scripts/tax-watch.mjs holds the logic; its pure half is covered by
# scripts/tax-watch.test.mjs, which runs first here so a parsing regression
# stops the job rather than producing a confident, wrong proposal.

on:
  schedule:
    # Weekly, plus daily through the first half of July when a Finance Act
    # takes effect and the rates actually move.
    - cron: "0 6 * * 1"
    - cron: "0 6 1-15 7 *"
  workflow_dispatch:
  push:
    branches:
      - claude/portfolio-website-setup-rpyerk
    paths:
      - ".github/workflows/tax-watch.yml"
      - "scripts/tax-watch*.mjs"
      - "portfolio/data/tax-rates.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: tax-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/portfolio-website-setup-rpyerk

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The rate cards turned out to live in PDFs behind JavaScript front ends,
      # so reading them needs pdf.js. Installed here rather than vendored: it
      # is 10MB and only the watcher ever needs it.
      - name: Install the PDF reader
        run: npm install --no-save --no-audit --no-fund pdfjs-dist@4.7.76

      # A parsing bug here would write a wrong tax rate into a proposal, so the
      # fixtures gate the run.
      - name: Test the extractor
        run: node scripts/tax-watch.test.mjs

      - name: Read the sources
        id: check
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";
          import { run, report } from "./scripts/tax-watch.mjs";

          const out = await run({ fs, path: "portfolio/data/tax-rates.json" });
          const md = report(out.results, out.meta);
          fs.writeFileSync("/tmp/report.md", md);
          console.log(md);

          const needsIssue = out.meta.stale || out.meta.unreachable.length ||
                             out.results.some((r) => !r.ok);
          const set = [
            "proposals=" + (out.proposals.length ? "1" : "0"),
            "issue=" + (needsIssue ? "1" : "0"),
            "confirmed=" + out.results.filter((r) => r.ok).length,
            "total=" + out.results.length
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, set.join("\n") + "\n");
          JS

      - name: Commit what we confirmed
        run: |
          if git diff --quiet -- portfolio/data/tax-rates.json; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio/data/tax-rates.json
          git commit -m "chore: re-read property tax sources ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4; do
            git push && break || { echo "push failed, retrying"; sleep $((2**i)); git pull --rebase || true; }
          done

      # A changed rate is a pull request, never a silent edit.
      - name: Open a pull request for any proposed rate
        if: steps.check.outputs.proposals == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="tax/proposed-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          node -e '
            const fs = require("fs");
            const p = "portfolio/data/tax-rates.json";
            const d = JSON.parse(fs.readFileSync(p, "utf8"));
            if (!d.proposed) process.exit(0);
            // Apply the proposal on the branch so the PR diff IS the change.
            for (const c of d.proposed.changes) {
              const keys = c.path.split("."); const last = keys.pop();
              keys.reduce((o, k) => o[k], d)[last] = c.to;
            }
            d.verified = false; d.verifiedBy = null; d.verifiedOn = null;
            d.proposed = null;
            fs.writeFileSync(p, JSON.stringify(d, null, 2) + "\n");
          '
          git add portfolio/data/tax-rates.json
          git commit -m "Proposed property tax rate changes from the source pages"
          git push -u origin "$BRANCH" --force
          {
            echo "A rate on the site no longer matches the source page. **Nothing is live until this is merged.**"
            echo
            cat /tmp/report.md
            echo
            echo "### Before merging"
            echo "1. Open each source and read the rate in context — the extractor finds figures near the right words, it does not understand the law."
            echo "2. If it is right, set \`verified: true\` with \`verifiedBy\` and \`verifiedOn\`, and update \`financeAct\` / \`effectiveFrom\`."
            echo "3. If it is wrong, close this and correct the keywords in \`audit.rules\`."
          } > /tmp/pr.md
          gh pr create --base claude/portfolio-website-setup-rpyerk --head "$BRANCH" \
            --title "Property tax rates: $(date -u +%Y-%m-%d) proposal" --body-file /tmp/pr.md \
            || gh pr edit "$BRANCH" --body-file /tmp/pr.md

      - name: Open or update the review issue
        if: steps.check.outputs.issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automatic check of the rates behind **transfer-costs.html**."
            echo
            echo "Confirmed ${{ steps.check.outputs.confirmed }} of ${{ steps.check.outputs.total }} against the live source pages."
            echo
            cat /tmp/report.md
            echo
            echo "### What to do"
            echo "- A ❌ row means the figure we show was not found beside those words. It may have changed, or the page may word it differently."
            echo "- Correct the rate in \`portfolio/data/tax-rates.json\`, or fix the keywords in \`audit.rules\` if the page simply moved."
            echo "- Set \`verified: true\` with \`verifiedBy\` and \`verifiedOn\` once you have checked each line."
          } > /tmp/issue.md
          TITLE="Property tax rates need review"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue.md
          fi
