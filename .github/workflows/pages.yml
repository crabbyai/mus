name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - claude/portfolio-website-setup-rpyerk
  workflow_dispatch:
  # Self-heal: GitHub's Pages deployment queue sometimes stalls for hours
  # (deployment_queued -> timeout). Retry on a schedule until it lands;
  # concurrency below stops attempts from stacking up.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload portfolio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages caps timeout at 600000ms; keep error tolerance high
          timeout: 600000
          error_count: 15
